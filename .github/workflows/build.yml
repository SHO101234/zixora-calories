name: Build calorie app (Android)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Restore stable test signing key
        env:
          CALORIE_KEYSTORE_BASE64: ${{ secrets.CALORIE_KEYSTORE_BASE64 }}
        run: echo "$CALORIE_KEYSTORE_BASE64" | base64 -d > app/calorie-test.p12
      - name: Build debug APK
        env:
          CALORIE_STORE_PASSWORD: ${{ secrets.CALORIE_STORE_PASSWORD }}
          CALORIE_KEY_ALIAS: ${{ secrets.CALORIE_KEY_ALIAS }}
          CALORIE_KEY_PASSWORD: ${{ secrets.CALORIE_KEY_PASSWORD }}
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calorie-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
